<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dpx — tu mentor senior de desarrollo en la terminal">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5a5f"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5a5f"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="16" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- barra superior tipo ventana de terminal -->
  <circle cx="36" cy="34" r="7" fill="#ff5a5f"/>
  <circle cx="62" cy="34" r="7" fill="#a855f7"/>
  <circle cx="88" cy="34" r="7" fill="#3b82f6"/>
  <text x="1244" y="40" text-anchor="end" font-family="'SF Mono','Segoe UI Mono',Consolas,monospace" font-size="15" fill="#6e7681">~/proyecto $ dpx</text>

  <!-- wordmark -->
  <text x="64" y="190" font-family="'SF Mono','Segoe UI Mono',Consolas,monospace" font-weight="700" font-size="140" fill="url(#wordmark)">dpx</text>

  <!-- cursor de bloque -->
  <rect x="372" y="92" width="26" height="110" rx="3" fill="#a855f7" opacity="0.85"/>

  <!-- tagline -->
  <text x="68" y="248" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="30" fill="#e6edf3">Tu mentor senior de desarrollo, directamente en tu terminal.</text>
  <text x="68" y="286" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8b949e">Agente de IA en Rust · DeepSeek · enseña, construye o hace el trabajo por ti.</text>

  <!-- chips de modo -->
  <g font-family="'SF Mono','Segoe UI Mono',Consolas,monospace" font-size="18" font-weight="600">
    <rect x="68" y="312" width="116" height="34" rx="17" fill="#ff5a5f" fill-opacity="0.14" stroke="#ff5a5f" stroke-opacity="0.5"/>
    <text x="126" y="334" text-anchor="middle" fill="#ff7a7e">dpx code</text>

    <rect x="196" y="312" width="116" height="34" rx="17" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="254" y="334" text-anchor="middle" fill="#c084fc">dpx hack</text>

    <rect x="324" y="312" width="126" height="34" rx="17" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="387" y="334" text-anchor="middle" fill="#60a5fa">dpx learn</text>
  </g>

  <!-- franja de acento derecha -->
  <rect x="1180" y="64" width="6" height="232" rx="3" fill="url(#accent)" opacity="0.7"/>
</svg>
