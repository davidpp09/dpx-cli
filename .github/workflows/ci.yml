name: CI

# Calidad mínima en cada push/PR: que compile, pase los tests y clippy limpio.
# Corre en Windows (la plataforma de desarrollo de dpx); los tests de
# integración a DeepSeek van `#[ignore]`, así que NO necesitan API key aquí.

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (sin warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
